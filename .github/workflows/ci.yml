name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y poppler-utils fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation
      - name: Check a Chromium-based browser is available for PDF tests
        run: which google-chrome || which chromium || which chromium-browser || echo "no browser: PDF tests will be skipped"
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Render examples
        run: python tools/build_previews.py
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: rendered-examples
          path: examples/output/
